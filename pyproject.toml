[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatclip"
version = "1.1.0"
description = "Rights-aware viral highlight discovery and configurable multi-reel vertical video production."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "YouTube Clipping Platform Team"}
]
keywords = [
    "youtube",
    "clipping",
    "shorts",
    "tiktok",
    "reels",
    "faster-whisper",
    "heatmap",
    "video-processing",
    "ffmpeg",
    "nvenc"
]
dependencies = [
    "faster-whisper>=1.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "yt-dlp>=2026.10.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.31.1",
    "markdown>=3.5.0",
    "psutil>=5.9.0",
    "edge-tts>=6.1.0",
    "ultralytics>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
chatclip = "yt_clipping.cli.master_cli:main"
yt-clip = "yt_clipping.cli.master_cli:main"
yt-clip-studio = "yt_clipping.web.server:start_server"
channel-watcher = "yt_clipping.discovery.channel_watcher:main"
pinger-daemon = "yt_clipping.discovery.pinger_daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_clipping = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

services:
  # ==============================================================================
  # FastAPI Clipping Engine & Intelligence Backend (Port 8000)
  # YuNet face tracking, Faster-Whisper ASR, FFmpeg rendering, Google Trends engine
  # ==============================================================================
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-backend
    restart: unless-stopped
    command: ["studio"]
    ports:
      - "8000:8000"
      - "8088:8088"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - DATA_DIR=/app/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - YT_EXECUTION_MODE=${YT_EXECUTION_MODE:-production}
      - LEGAL_OFFICER=${LEGAL_OFFICER:-true}
      - WEB_STUDIO_API_KEY=${WEB_STUDIO_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3050,http://127.0.0.1:3050}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - DEFAULT_LAYOUT_MODE=active_speaker
      - DEFAULT_SUBTITLE_PRESET=hormozi
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}

  # ==============================================================================
  # Next.js 15 Modern Studio Workspace (Port 3050)
  # Precision 3-Column Video Editor, Viral Discovery, Retention Curve, SupoClip AI
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yt-clipping-frontend
    restart: unless-stopped
    ports:
      - "3050:3050"
    depends_on:
      - studio
    environment:
      - NODE_ENV=production
      - PORT=3050
      - FASTAPI_BACKEND_URL=http://studio:8000

  # ==============================================================================
  # 24/7 Autonomous Discovery & Clipping Daemon (Optional Background Profile)
  # Continuously polls creator channels via RSS/API and dispatches jobs
  # ==============================================================================
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-daemon
    restart: unless-stopped
    command: ["daemon"]
    profiles: ["daemon", "full"]
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - YT_EXECUTION_MODE=${YT_EXECUTION_MODE:-production}
      - LEGAL_OFFICER=${LEGAL_OFFICER:-true}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DEFAULT_LAYOUT_MODE=active_speaker
      - DEFAULT_SUBTITLE_PRESET=hormozi

  # ==============================================================================
  # 24/7 Priority Job Queue Processing Worker (Optional Background Profile)
  # Leases and processes rendering, AI framing, transcription, and QA verification
  # ==============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-worker
    restart: unless-stopped
    command: ["worker"]
    profiles: ["worker", "full"]
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - YT_EXECUTION_MODE=${YT_EXECUTION_MODE:-production}
      - LEGAL_OFFICER=${LEGAL_OFFICER:-true}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - POLL_INTERVAL=5.0
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}

  # ==============================================================================
  # Model Context Protocol (MCP) Server (Optional MCP Profile)
  # Exposes JSON-RPC 2.0 tools for AI agents and agentic IDEs
  # ==============================================================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-mcp
    restart: unless-stopped
    command: ["mcp"]
    profiles: ["mcp"]
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - YT_EXECUTION_MODE=${YT_EXECUTION_MODE:-production}
      - LEGAL_OFFICER=${LEGAL_OFFICER:-true}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
